services:
  postgres:
    image: postgres:16-alpine
    container_name: pilotspos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pilotspos
      POSTGRES_PASSWORD: pilotspos_dev
      POSTGRES_DB: pilotspos
    ports:
      - "5432:5432"
    volumes:
      - pilotspos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilotspos -d pilotspos"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: pilotspos_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  pilotspos_postgres_data:
