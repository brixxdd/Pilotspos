# Corte POS — vhost de producción.
# Instalar en /etc/nginx/sites-available/corte.devpilots.dev y enlazar en
# sites-enabled. El bloque SSL lo escribe Certbot; ver deploy/README.md.

server {
    listen 80;
    listen [::]:80;
    server_name corte.devpilots.dev;

    # Certbot valida por HTTP-01; Cloudflare deja pasar esta ruta aunque el
    # proxy esté encendido.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name corte.devpilots.dev;

    # Sin esto, Fastify ve la IP del edge de Cloudflare para TODOS los
    # visitantes: el límite global de 300/min se comparte entre todo el mundo
    # y el registro de clientes (5 cada 10 min) queda inservible.
    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    ssl_certificate     /etc/letsencrypt/live/corte.devpilots.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/corte.devpilots.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # El menú digital es público y va a recibir escaneos de QR desde la calle.
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
